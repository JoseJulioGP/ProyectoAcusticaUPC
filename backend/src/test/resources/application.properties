# Solo para tests. Supabase (pooler en modo sesion) limita a 15 clientes.
# Cada @SpringBootTest con distinto set de @MockitoBean crea un contexto nuevo
# cuyo pool Hikari NO se cierra entre clases. Sin este cap, varios contextos
# acumulan >15 conexiones y los ultimos fallan con
# "FATAL: max clients reached in session mode".
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
