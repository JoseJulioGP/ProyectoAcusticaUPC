name: Keep Render Awake

# Mantiene despierto el backend de AcústicaUPC en Render (free tier)
# durmiendo entre 3:00-4:00 AM Colombia para respetar las 750 hrs/mes.
#
# Cron en UTC. Colombia es UTC-5, así que 3:00 AM Colombia = 8:00 UTC.
# La expresión "0-7,9-23" excluye la hora 8 UTC (ventana de sueño).

on:
  schedule:
    - cron: '*/5 0-7,9-23 * * *'
  workflow_dispatch:  # permite ejecutarlo manualmente desde la UI

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://acustica-backend.onrender.com/actuator/health"
          echo "Pinging $URL at $(date -u) UTC"
          
          status=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 60 "$URL" || echo "000")
          echo "HTTP status: $status"
          echo "Response body:"
          cat /tmp/body || true
          echo ""
          
          # No fallamos el workflow por errores transitorios (boot, 502, timeout).
          # Solo registramos. Render despierta igual con cualquier request.
          if [ "$status" = "200" ]; then
            echo "OK: backend awake"
          else
            echo "Warning: status $status (probable boot tras ventana muerta)"
          fi